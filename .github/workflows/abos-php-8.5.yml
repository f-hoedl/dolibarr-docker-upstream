# ABOS (os.hoedl.co): Dolibarr 23.0.3 on PHP 8.5. OPcache is built into 8.5, ext-imap left
# core in 8.4 (ABOS uses the pure-PHP webklex client, MAIN_IMAP_USE_PHPIMAP=1).
name: abos-php-8.5
permissions:
  contents: read
  packages: write
on:
  push:
    branches: [abos/php-8.5]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dolibarr:23.0.3-php8.5.12
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push
        run: |
          docker build images/23.0.3-php8.5 --tag "${IMAGE}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          v=$(docker run --rm --entrypoint php "${IMAGE}" -r 'echo PHP_VERSION;')
          test "${v}" = "8.5.12"
          docker push "${IMAGE}"
