# Bridge images for CVE-2026-109618 / CVE-2026-109619 (Dolibarr/dolibarr-docker#140).
# Builds the unmodified upstream Dockerfiles with only the base pinned to the patched
# PHP release, until dolibarr/dolibarr is rebuilt. Not a replacement for the official images.
name: bridge-php-8.2.35
permissions:
  contents: read
  packages: write
on:
  push:
    branches: [bridge/php-8.2.35]
    paths: [.github/workflows/bridge-php-8.2.35.yml]
  workflow_dispatch:

env:
  PHP_BASE: 8.2.35-apache-bookworm
  PLATFORMS: linux/amd64

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        dolibarr_version: [19.0.4, 20.0.4, 21.0.4, 22.0.5, 23.0.4, 24.0.2]
    runs-on: ubuntu-24.04
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/dolibarr:${{ matrix.dolibarr_version }}-php8.2.35
      DIR: images/${{ matrix.dolibarr_version }}-php8.2
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Pin patched PHP base
        run: |
          sed -i "s#^FROM \${ARCH}php:8.2-apache-bookworm#FROM \${ARCH}php:${PHP_BASE}#" "${DIR}/Dockerfile"
          grep -n '^FROM' "${DIR}/Dockerfile" | grep -q "php:${PHP_BASE}"
      - name: Build and push
        run: |
          docker buildx build "${DIR}" --platform "${PLATFORMS}" --push --tag "${IMAGE}" \
            --label org.opencontainers.image.source="https://github.com/${{ github.repository }}" \
            --label org.opencontainers.image.description="Bridge image: dolibarr/dolibarr ${{ matrix.dolibarr_version }} rebuilt on PHP 8.2.35 (CVE-2026-109618/109619). Switch back to dolibarr/dolibarr once it is rebuilt."
      - name: Verify PHP version
        run: |
          v=$(docker run --rm --platform linux/amd64 --entrypoint php "${IMAGE}" -r 'echo PHP_VERSION;')
          echo "${IMAGE}: PHP ${v}"
          test "${v}" = "8.2.35"
